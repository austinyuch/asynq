name: build

# CI 最小化策略:權威測試 gate 在 local(Valkey 全套,見 .agents/skills/upstream-sync/)。
# CI 只在 PR → main 時做最後防線;單一 Go 版本、單一 job。
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      redis:
        image: valkey/valkey:9.1.0
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          cache: true

      - name: Build all modules
        run: |
          go build ./...
          (cd x && go build ./...)
          (cd tools && go build ./...)

      - name: Test core module
        run: go test -race ./...

      - name: Test x module
        run: cd x && go test -race ./...

      - name: Test tools module
        run: cd tools && go test -race ./...
